name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      # Regenerate the synthetic PDFs and run the eval (F1 is on synthetic data only).
      - run: python eval/make_samples.py
      - run: python -m eval.run_eval
