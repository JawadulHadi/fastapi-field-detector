[project]
name = 'fastapi-field-detector'
version = '0.1.0'
description = 'Detect signature, date, name, initials and checkbox fields in PDFs. FastAPI, PyMuPDF, optional local LLM, with an eval harness.'
requires-python = '>=3.11'
dependencies = ['fastapi>=0.115', 'uvicorn>=0.30', 'pymupdf>=1.24', 'pydantic>=2.7',
                'python-multipart>=0.0.9', 'httpx>=0.27']

[project.optional-dependencies]
dev = ['pytest>=8', 'ruff>=0.6']

[tool.setuptools]
packages = ['field_detector']

[tool.ruff]
line-length = 110
target-version = 'py311'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B']

[tool.pytest.ini_options]
pythonpath = ['.']

# Vercel's FastAPI preset looks for app.py or app/main.py; the app lives in a package, so name it.
[tool.vercel]
entrypoint = 'field_detector.app:app'
